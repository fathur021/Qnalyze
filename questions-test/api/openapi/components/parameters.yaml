IdParam:
  name: id
  in: path
  required: true
  description: ID resource (question, kategori, attempt, atau user)
  schema:
    type: integer
    minimum: 1
    example: 1
PageParam:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1
LimitParam:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10
SearchParam:
  name: search
  in: query
  required: false
  schema:
    type: string
